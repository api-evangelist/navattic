  - host: https://www.navattic.com
    path: /robots.txt
    status: 200
    content_type: text/plain
    file: navattic-robots.txt
    note: >
      Carries a Cloudflare Content Signals policy line —
      "Content-Signal: ai-train=no, search=yes, ai-input=no" — a published,
      machine-readable AI consent preference. app.navattic.com and
      api.navattic.com both serve "User-agent: * / Disallow: /" instead.
  - host: https://app.navattic.com
