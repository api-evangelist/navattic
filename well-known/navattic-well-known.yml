generated: '2026-08-13'
method: searched
source: live probes of every Navattic host on 2026-08-13
description: >
  Navattic serves a real, non-trivial /.well-known/ discovery surface. The
  marketing host publishes an RFC 9727 api-catalog linkset that points at both
  the website OpenAPI and the hosted MCP server, and the application host
  publishes RFC 8414 authorization-server metadata plus RFC 9728
  protected-resource metadata for that MCP server. No security.txt is served on
  any host.
hosts:
  - https://www.navattic.com
  - https://app.navattic.com
  - https://docs.navattic.com
  - https://api.navattic.com
documents:
  - host: https://www.navattic.com
    path: /.well-known/api-catalog          # RFC 9727
    status: 200
    content_type: application/json
    file: navattic-api-catalog.json
    note: >
      Linkset with two anchors — https://www.navattic.com/ (service-desc
      /.well-known/openapi.json, service-doc docs.navattic.com, status
      /api/health) and https://app.navattic.com/api/mcp (service-desc the OAuth
      authorization-server metadata). This is the document that led to both the
      website OpenAPI and the MCP server.
  - host: https://www.navattic.com
    path: /.well-known/openapi.json
    status: 200
    content_type: application/json
    file: ../openapi/navattic-website-openapi.json
    note: >
      OpenAPI 3.0.3, info.title "Navattic marketing website", servers
      https://www.navattic.com, one operation (GET /api/health). Saved verbatim
      to openapi/.
  - host: https://www.navattic.com
    path: /.well-known/oauth-authorization-server
    status: 200
    content_type: application/json
    file: navattic-oauth-authorization-server.json
    note: >
      The marketing host proxies the same document the app host serves; issuer
      is https://app.navattic.com either way.
