    note: >
      issuer https://app.navattic.com; authorization/token/registration/
      revocation endpoints under /api/mcp/oauth/; 11 scopes_supported; dynamic
      client registration enabled; PKCE.
  - host: https://app.navattic.com
    path: /.well-known/oauth-protected-resource     # RFC 9728
    status: 200
    content_type: application/json
    file: navattic-oauth-protected-resource.json
    note: >
      resource https://app.navattic.com/api/mcp, resource_name "Navattic MCP
      Server", bearer_methods_supported [header]. Also served at the
      path-suffixed /.well-known/oauth-protected-resource/api/mcp (200).
