description: >
  The crosswalk exists to record a real and unusual divergence at Navattic: the
  MCP server and the OpenAPI describe entirely disjoint surfaces. Every product
  capability an agent can reach is MCP-only — Navattic publishes no REST API
  reference for demos, flows, visitors or analytics — and the only published
  OpenAPI operation is a health check on the marketing website. There is
  therefore nothing to bind, and that emptiness is the finding.
