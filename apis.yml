apis:
  - aid: navattic:navattic-api
    name: Navattic API
    description: >
      The Navattic REST API allows developers to programmatically create and
      manage interactive product demos, retrieve analytics and engagement data,
      and integrate demo activity into downstream systems. The API uses API key
      authentication and supports webhook delivery of session-closed events
      containing visitor engagement data, company account information, and
      CRM-linked fields. Navattic also provides an MCP (Model Context Protocol)
      server for AI coding agents to interact with the platform programmatically.
    humanURL: https://docs.navattic.com/
