apis:
- aid: navattic:navattic-mcp-server
  name: Navattic MCP Server
  description: >
    Navattic's hosted, remote Model Context Protocol server — the company's primary machine-readable product
    surface. Agents authenticate with an OAuth 2.1 authorization-code flow (PKCE, dynamic client registration)
    or with a workspace Personal Access Token sent as a bearer token, and receive workspace-scoped access
    to demo analytics, demo browsing, demo building, demo management, demo publishing, personalization
    and Launchpad, governed by eleven published OAuth scopes. Writes carry an entity_tag optimistic concurrency
    token and each batch of edits applies atomically.
  humanURL: https://docs.navattic.com/workspace/mcp-server
  baseURL: https://app.navattic.com/api/mcp
  tags:
  - MCP
  - Agents
  - Authentication
  - Interactive Demos
