description: >
  Navattic publishes no error reference. The website OpenAPI declares no 4xx/5xx
  responses to derive from — it has one operation, GET /api/health, with a 200
  only — so this catalog records only error envelopes actually observed on the
  wire. Two distinct shapes are in use across the estate, neither of which is
  application/problem+json.
problems:
