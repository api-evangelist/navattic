    content_type: application/json
    envelope_field: error
    body: 'Unauthorized. Provide a valid access token as a Bearer token in the Authorization header.'
    title: Unauthorized
    remediation: >
      Complete the OAuth authorization-code flow, or send a workspace Personal
      Access Token as `Authorization: Bearer <token>`. Returned for both
      `initialize` and `tools/list` when no credential is presented.
    method: probed
  - status: 404
    surface: https://api.navattic.com/*
    content_type: application/json
    envelope_field: message
    body: Request unhandled
    title: Request unhandled
    remediation: >
      Observed on api.navattic.com for unrouted paths. Note the different
      envelope field (`message`, not `error`) from the MCP surface.
    method: probed
  - status: 404
    surface: https://app.navattic.com/*, https://api.navattic.com/*
    content_type: text/html
    envelope_field: null
    title: Application 404 page
    remediation: >
      Most unrouted paths on the app and api hosts return the Next.js HTML
      error shell rather than JSON, including every /.well-known/* path that is
      not implemented. Clients must not treat a 200/404 HTML body as an API
      response.
    method: probed
